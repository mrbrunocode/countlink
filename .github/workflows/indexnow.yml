name: indexnow

# After every push to main (auto-deployed via the git-connected Cloudflare
# integration), submit all sitemap URLs to IndexNow so Bing/Yandex/Seznam/
# Naver re-crawl promptly. Google doesn't participate; it re-reads
# sitemap.xml on its own schedule. Mirrors diffhero's workflow — see
# diffhero/docs/seo-plan.md §1.3.

on:
  push:
    branches: [main]

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Wait for Cloudflare deploy to settle
        run: sleep 90
      - name: Submit sitemap URLs to IndexNow
        run: node scripts/submit-indexnow.mjs
