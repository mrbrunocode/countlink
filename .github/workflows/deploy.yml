name: Deploy to Cloudflare Pages

# This project deploys via direct-upload (wrangler pages deploy), not
# Cloudflare's GitHub-App-connected Pages source — that connection method
# has to be authorized through the Cloudflare dashboard's OAuth flow and
# can't be created via the API, so this workflow is the equivalent
# auto-deploy-on-push behavior without needing that dashboard step.
#
# Deploys from a `dist/` staging copy, not the repo root — the repo root
# also contains scripts/, docs/, README.md etc. which aren't meant to be
# publicly servable. An earlier version of this workflow deployed `.`
# directly and briefly uploaded those alongside the real site; this list
# must stay in sync with the "public site files" set (index.html,
# privacy.html, compare.html, about.html, how-it-works.html, terms.html,
# contact.html, robots.txt, sitemap.xml, llms.txt, ads.txt, _headers,
# _redirects, manifest.json, sw.js, assets/, timers/) if that set ever
# changes — every hand-written .html page added to STATIC_PAGES in
# scripts/build-timer-pages.mjs needs a matching entry in the `cp` line
# below, or its nav/footer links will resolve everywhere except the one
# place that matters: production.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build dist/ (public site files only)
        run: |
          mkdir -p dist
          cp index.html privacy.html compare.html about.html how-it-works.html terms.html contact.html \
             robots.txt sitemap.xml llms.txt ads.txt _headers _redirects manifest.json sw.js dist/
          cp -r assets dist/
          cp -r timers dist/
          # IndexNow key file (32-hex-char name) — must be reachable at the
          # domain root for IndexNow to verify ownership before accepting
          # submissions. Globbed rather than hardcoded since the filename IS
          # the key value; shopt -s nullglob avoids an error if none exists.
          shopt -s nullglob
          cp [0-9a-f]*.txt dist/ 2>/dev/null || true
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=countlink --branch=main
