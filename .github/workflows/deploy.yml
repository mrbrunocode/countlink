name: Deploy to Cloudflare Pages

# This project deploys via direct-upload (wrangler pages deploy), not
# Cloudflare's GitHub-App-connected Pages source — that connection method
# has to be authorized through the Cloudflare dashboard's OAuth flow and
# can't be created via the API, so this workflow is the equivalent
# auto-deploy-on-push behavior without needing that dashboard step.
#
# Deploys from a `dist/` staging copy, not the repo root — the repo root
# also contains scripts/, docs/, README.md etc. which aren't meant to be
# publicly servable.
#
# DENY-LIST, NOT ALLOW-LIST. This used to `cp` a hand-maintained list of
# public files, and it drifted exactly as its own comment warned it would:
# `guides/` was added on 2026-07-23 (7 editorial articles, plus an index,
# all 8 listed in sitemap.xml) and was never added to the copy list, so for
# weeks every one of those URLs silently served index.html at HTTP 200 while
# the sitemap advertised them to Google as unique content. `404.html` hit the
# same trap the day it was added. An allow-list fails silently and in the
# worst direction — content that exists in the repo, is linked in the nav,
# and is declared in the sitemap simply isn't there in production.
#
# So: copy everything, then remove the things that must not be public. A new
# page or directory is live by default; the failure mode of forgetting to
# update this list is now "something private leaks" (loud, caught by the
# guard step below) rather than "real content is missing" (silent, invisible
# until someone curls production).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build dist/ (everything except non-public paths)
        run: |
          rsync -a ./ dist/ \
            --exclude 'dist' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude '.wrangler' \
            --exclude '.gitignore' \
            --exclude 'node_modules' \
            --exclude 'scripts' \
            --exclude 'test' \
            --exclude 'docs' \
            --exclude 'archive' \
            --exclude 'design-system' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'e2e' \
            --exclude 'playwright.config.mjs' \
            --exclude 'playwright-report' \
            --exclude 'test-results' \
            --exclude 'README.md'
      - name: Guard — nothing private, and the public set is complete
        run: |
          # Loud failure if an excluded path slipped through.
          for bad in scripts test e2e docs archive design-system package.json package-lock.json node_modules playwright.config.mjs README.md .git .github; do
            if [ -e "dist/$bad" ]; then echo "::error::$bad leaked into dist/"; exit 1; fi
          done
          # Every URL the sitemap advertises must exist as a file. This is the
          # check that would have caught the guides/ regression on day one.
          missing=0
          while read -r loc; do
            path="${loc#https://countlink.app}"; path="${path#/}"
            [ -z "$path" ] && continue
            if [ -f "dist/$path" ] || [ -f "dist/$path.html" ] || [ -f "dist/$path/index.html" ]; then :; else
              echo "::error::sitemap lists /$path but no file for it in dist/"; missing=1
            fi
          done < <(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -E 's|</?loc>||g')
          [ "$missing" = 0 ] || exit 1
          echo "dist/ OK — $(find dist -name '*.html' | wc -l) html files"
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=countlink --branch=main
