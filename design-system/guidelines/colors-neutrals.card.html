<!-- @dsCard group="Colors" viewport="700x220" subtitle="Neutral scale — cool, near-black to near-white" name="Neutrals" -->
<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);font-family:var(--font-ui);}
.row{display:flex;}
.sw{flex:1;height:70px;display:flex;align-items:flex-end;padding:6px;font-size:10px;color:var(--n-9);}
.sw:nth-child(-n+5){color:var(--n-0);}
</style></head>
<body data-theme="dark">
<div class="row">
  <div class="sw" style="background:var(--n-0)">n-0</div>
  <div class="sw" style="background:var(--n-1)">n-1</div>
  <div class="sw" style="background:var(--n-2)">n-2</div>
  <div class="sw" style="background:var(--n-3)">n-3</div>
  <div class="sw" style="background:var(--n-4)">n-4</div>
  <div class="sw" style="background:var(--n-5)">n-5</div>
  <div class="sw" style="background:var(--n-6)">n-6</div>
  <div class="sw" style="background:var(--n-7)">n-7</div>
  <div class="sw" style="background:var(--n-8)">n-8</div>
  <div class="sw" style="background:var(--n-9)">n-9</div>
</div>
<div style="padding:14px 4px;font-size:12px;color:var(--text-tertiary)">Dark theme shown. n-0→n-2 = backgrounds/surfaces, n-3→n-5 = borders, n-6→n-9 = text.</div>
</body>
</html>
