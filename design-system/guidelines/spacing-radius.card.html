<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Corner radii used across controls and surfaces" name="Corner Radii" -->
<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);font-family:var(--font-ui);padding:24px;display:flex;gap:16px;align-items:flex-end;}
.box{background:var(--surface-elevated);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-tertiary);}
</style></head>
<body data-theme="dark">
  <div class="box" style="width:70px;height:70px;border-radius:var(--radius-sm)">sm 6</div>
  <div class="box" style="width:70px;height:70px;border-radius:var(--radius-md)">md 10</div>
  <div class="box" style="width:70px;height:70px;border-radius:var(--radius-lg)">lg 16</div>
  <div class="box" style="width:70px;height:70px;border-radius:var(--radius-xl)">xl 24</div>
  <div class="box" style="width:70px;height:70px;border-radius:var(--radius-full)">full</div>
</body>
</html>
