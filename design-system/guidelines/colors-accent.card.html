<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);font-family:var(--font-ui);}
.row{display:flex;gap:0;}
.sw{flex:1;height:90px;display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:600;}
</style></head>
<body data-theme="dark">
<div class="row">
  <div class="sw" style="background:var(--accent-softer);color:var(--accent)">softer</div>
  <div class="sw" style="background:var(--accent-soft);color:var(--accent)">soft</div>
  <div class="sw" style="background:var(--accent);color:var(--on-accent)">accent</div>
  <div class="sw" style="background:var(--accent-strong);color:var(--n-9)">strong</div>
</div>
<div style="padding:12px 4px;font-size:12px;color:var(--text-tertiary)">One accent, used everywhere: primary CTAs, active/synced states, links, focus rings.</div>
</body>
</html>
