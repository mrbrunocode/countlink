<!-- @dsCard group="Colors" viewport="700x150" subtitle="Shadow depth + live-pulse motion cue" name="Elevation & Motion" -->
<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);font-family:var(--font-ui);display:flex;gap:20px;align-items:center;height:150px;padding:0 28px;}
.box{background:var(--surface-elevated);border-radius:12px;width:90px;height:70px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-tertiary);}
.dot{width:10px;height:10px;border-radius:50%;background:var(--success);animation:cl-pulse-live 1.6s ease-in-out infinite;}
</style></head>
<body data-theme="dark">
  <div class="box" style="box-shadow:var(--shadow-xs)">xs</div>
  <div class="box" style="box-shadow:var(--shadow-sm)">sm</div>
  <div class="box" style="box-shadow:var(--shadow-md)">md</div>
  <div class="box" style="box-shadow:var(--shadow-lg)">lg</div>
  <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary);"><span class="dot"></span> live pulse</div>
</body>
</html>
