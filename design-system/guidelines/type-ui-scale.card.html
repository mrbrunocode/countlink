<!-- @dsCard group="Type" viewport="700x320" subtitle="Inter — headings and body copy" name="UI Type Scale" -->
<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--text-primary);font-family:var(--font-ui);padding:24px;display:flex;flex-direction:column;gap:8px;}
.row{display:flex;align-items:baseline;gap:14px;}
.tag{font-size:10px;color:var(--text-tertiary);width:90px;flex-shrink:0;font-family:var(--font-display)}
</style></head>
<body data-theme="dark">
<div class="row"><span class="tag">2xl / 700</span><span style="font-size:32px;font-weight:700;letter-spacing:var(--tracking-tight)">Countdown to launch</span></div>
<div class="row"><span class="tag">xl / 600</span><span style="font-size:24px;font-weight:600">Create a synced timer</span></div>
<div class="row"><span class="tag">md / 500</span><span style="font-size:17px;font-weight:500">Everyone sees the same number</span></div>
<div class="row"><span class="tag">base / 400</span><span style="font-size:15px;font-weight:400;color:var(--text-secondary)">Share a link and it counts down for everyone, together, in real time.</span></div>
<div class="row"><span class="tag">sm / 500</span><span style="font-size:13px;font-weight:500;color:var(--text-tertiary)">UNTIL LAUNCH</span></div>
</body>
</html>
